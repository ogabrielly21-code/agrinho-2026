<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agro Forte & Sustentável</title>
    <style>
        /* Reset básico */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0B2516; /* Verde Escuro */
            color: #F8F9FA;
            line-height: 1.6;
        }

        /* Container Principal */
        .hero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 10% 5%;
            gap: 30px;
        }

        .hero-content {
            max-width: 50%;
        }

        .hero-content h1 {
            font-size: 3.5rem;
            color: #FF007F; /* Rosa Principal */
            line-height: 1.2;
            margin-bottom: 20px;
        }

        .hero-content p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: #D1D5DB;
        }

        /* Botão Chamativo */
        .btn-rosa {
            background-color: #FF007F;
            color: white;
            padding: 15px 35px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.4);
            transition: all 0.3s ease;
        }

        .btn-rosa:hover {
            background-color: #E0006C;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 0, 127, 0.6);
        }

        /* Área da Imagem */
        .
